name: CI

# Runs on pull requests only. A merge to main doesn't re-run these checks: the
# PR head was already verified, and deploy-pages.yml rebuilds the demo on main.
#
# `pull_request` (never `pull_request_target`) keeps fork PRs safe: they get a
# read-only token and no secrets.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # No paths-ignore: `test` is a required check on main, and a workflow skipped by
    # a path filter never reports, which would block docs-only PRs
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes the previous run
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Draft PRs don't use Actions minutes; marking one ready for review runs CI
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 includes npm 11, which package.json devEngines requires
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build library
        run: npm run build:lib

      - name: Build demo
        run: npm run build:demo
