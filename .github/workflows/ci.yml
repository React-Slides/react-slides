name: CI

# Runs on pull requests only. A merge to main doesn't re-run these checks: the
# PR head was already verified, and deploy-pages.yml rebuilds the demo on main.
#
# `pull_request` (never `pull_request_target`) keeps fork PRs safe: they get a
# read-only token and no secrets.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # No paths-ignore: `test` is a required check on main, and a workflow skipped by
    # a path filter never reports, which would block docs-only PRs
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes the previous run
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Draft PRs don't use Actions minutes; marking one ready for review runs CI
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Auto-caching would run npm before the npm 11 upgrade below
          package-manager-cache: false
          node-version-file: .nvmrc

      # package.json devEngines requires npm 11; npm 10 can't resolve this dependency tree
      - name: Upgrade npm
        run: npm install -g npm@11

      # Not setup-node's `cache: npm`: it runs npm in the repo before the upgrade above,
      # which devEngines rejects
      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build library
        run: npm run build:lib

      - name: Build demo
        run: npm run build:demo
